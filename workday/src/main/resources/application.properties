spring.application.name=workday

# ---------------------------------------------------------------------------
# Datasource. Every value is overridable by environment variable so that no
# credential is ever committed. See docs/local-setup.md.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workday}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only verifies that the mapping agrees.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JWT. The default secret is for local development only.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktd29ya2RheS1obWFjLXNlY3JldC1jaGFuZ2UtbWUtaW4tYW55LXJlYWwtZW52aXJvbm1lbnQ=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.issuer=workday-api

# ---------------------------------------------------------------------------
# CORS for the separately hosted React dev server.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------------------------------------------------------------------------
# Pagination defaults for collection endpoints.
# ---------------------------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Never leak internals to API clients.
server.error.include-stacktrace=never
server.error.include-message=never
