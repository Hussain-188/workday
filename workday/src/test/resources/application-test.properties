# Integration tests run the real Flyway migrations against a dedicated MySQL
# schema, so database constraints (unique keys, foreign keys, check constraints)
# are exercised exactly as they behave in production.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:workday_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=integration-test-signing-secret-long-enough-for-hmac-sha256
app.jwt.expiration-minutes=60
app.jwt.issuer=workday-api

app.cors.allowed-origins=http://localhost:5173

logging.level.org.springframework.security=WARN
